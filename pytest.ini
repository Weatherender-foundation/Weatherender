[pytest]
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.*
    ignore::RuntimeWarning
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi\.extension
asyncio_mode = strict
markers =
    asyncio: mark test as asyncio-based
addopts = -v --cov=src --cov-report=xml
